

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WrongAI - The Art of Being Wrong</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>WRONG<span>AI</span></h1>
        <p>THE ART OF BEING WRONG.</p>
        <div class="status">● SYSTEM ONLINE</div>
    </header>

    <main>

        <div class="welcome">
            <h2>Welcome to WrongAI.</h2>
            <p>Ask anything. Receive the wrong answer.</p>
        </div>

        <div id="chat">
            <div class="bot-message">
                <strong>WRONGAI:</strong>
                Olá! Sou a WrongAI. Minha especialidade é estar errada.
                <br>Faça uma pergunta!
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="question"
                placeholder="Digite sua pergunta..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">ENVIAR</button>
        </div>

    </main>

    <footer>
        WRONGAI © 2026 | ALL WRONGS RESERVED.
    </footer>

    <script src="script.js"></script>

</body>
</html>
